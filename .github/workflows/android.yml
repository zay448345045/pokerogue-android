name: Android ci

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择要构建的分支'
        required: true
        default: 'new'
#on:
#  push:
#    branches: [ "main", "master" ]
#    tags:
#      - 'V-*'
#      - 'v*'
#      - '[0-9]*'
#  pull_request:
#    branches: [ "main", "master" ]
#  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: cu
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0
      - name: 强制拉取子模块最新代码
        run: |
          # 这一步会根据 .gitmodules 里的 branch 配置去拉取最新远程提交
          git submodule update --remote --recursive
          
          # 极客验证：在日志里打印一下，看看是不是你最新的修改
          cd pkmain/pokerogue
          echo "当前子模块分支: $(git rev-parse --abbrev-ref HEAD)"
          echo "最后一次提交信息: $(git log -1 --oneline)"
          cd ../..
      - name: JDK
        uses: actions/setup-java@v5
        with: 
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

#          
 #      - name: Android SDK 
#        run: |
#          export NEW_SDK_ROOT=${{ github.workspace }}/custom-android-sdk
#          mkdir -p $NEW_SDK_ROOT

#          echo "Created isolated SDK root at: $NEW_SDK_ROOT"

#          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$NEW_SDK_ROOT \
#            "platform-tools" \
#            "platforms;android-33" \
#            "build-tools;30.0.2" \
#            "ndk;27.0.12077973"  \
#            "ndk;22.1.7171670"

#          cp -r ${ANDROID_HOME}/licenses $NEW_SDK_ROOT/

#          echo "ANDROID_HOME=$NEW_SDK_ROOT" >> $GITHUB_ENV
#          echo "ANDROID_SDK_ROOT=$NEW_SDK_ROOT" >> $GITHUB_ENV


      - name: chm
        run: chmod +x gradlew
      - name: 安装 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
#          cache-dependency-path: pkmain/pokerogue/package-lock.json
      - name: 编译并同步 Web 资源
        run: |
          # 1. 进入子模块编译最新的 Web 代码
          cd pkmain/pokerogue
          npm install
          npm run build
          cd ../..

          # 2. 关键：将编译产物覆盖到 Android 壳的资源目录
          # 注意：请根据你 new 分支的实际路径调整下面这两行
          # 常见的路径是 app/src/main/assets/www 或 app/src/main/assets/public
          rm -f app/src/main/assets/assets/web/index.html
          rm -rf app/src/main/assets/assets/web/assets/*
          cp -r pkmain/pokerogue/dist/assets/* app/src/main/assets/web/assets/
          cp pkmain/pokerogue/dist/index.html app/src/main/assets/web/index.html
          ls -R app/src/main/assets/web/assets/ | head -n 5
      - name: debug
        run: ./gradlew assembleDebug 
        #assembleRelease --stacktrace

#      - name: t
#        id: set_name
#        run: |
#          if [[ $GITHUB_REF == refs/tags/* ]]; then
#            TAG_NAME=${GITHUB_REF#refs/tags/}
#            echo "APP_NAME=$TAG_NAME" >> $GITHUB_ENV
#            echo "Detected Tag: $TAG_NAME"
#          else
      - name: 更新 Nightly
        uses: softprops/action-gh-release@v2
#        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Nightly Build#${{ github.run_number }}"
          prerelease: true
          overwrite: true
          body: |
            ### 构建信息
            - **安卓壳分支**: `${{ github.event.inputs.branch }}`
            - **子模块分支**: `easy`
            - **构建时间**: ${{ github.event.repository.updated_at }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
